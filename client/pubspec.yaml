name: client
description: "Система управления полетными режимами авиамодели планера F1C."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Используем стабильную версию 2.x для совместимости с SDK
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  
  path_provider: ^2.1.5
  uuid: ^4.5.2
  collection: ^1.19.1
  http: ^1.5.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Инструменты генерации перенесены в dev_dependencies
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Medium.ttf